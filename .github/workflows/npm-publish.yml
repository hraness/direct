name: Publish npm package

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact package
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      already_public: ${{ steps.availability.outputs.already_public }}
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
      package_version: ${{ steps.artifact.outputs.package_version }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      tarball_name: ${{ steps.artifact.outputs.tarball_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Pin npm
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 \
            --ignore-scripts \
            --registry=https://registry.npmjs.org
          test "$(npm --version)" = "11.19.0"
          [[ "$(node --version)" == v24.* ]]
      - name: Verify release tag identity
        id: identity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != push || \
                "$GITHUB_REF" != "refs/tags/$GITHUB_REF_NAME" || \
                ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::npm publication requires an exact stable tag push"
            exit 1
          fi
          git check-ref-format "refs/tags/$GITHUB_REF_NAME"
          git check-ref-format "refs/heads/$DEFAULT_BRANCH"
          git fetch --no-tags origin \
            "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          default_head="$(git rev-parse "origin/$DEFAULT_BRANCH")"
          checked_out_head="$(git rev-parse HEAD)"
          if [[ "$GITHUB_SHA" != "$checked_out_head" ]]; then
            echo "::error::Tag event does not match the checked package commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$default_head"; then
            echo "::error::Tag $GITHUB_REF_NAME is not reachable from current $DEFAULT_BRANCH"
            exit 1
          fi
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          if [[ "$package_name" != "@hraness/direct" || \
                ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || \
                "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the Direct package identity"
            exit 1
          fi
          release_ref="refs/direct-npm-publish-tags/$GITHUB_REF_NAME"
          git fetch --no-tags origin "refs/tags/$GITHUB_REF_NAME:$release_ref"
          remote_tag_sha="$(git rev-parse "$release_ref^{commit}")"
          if [[ "$remote_tag_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not resolve to the checked package commit"
            exit 1
          fi
          printf 'source_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Verify package publication state
        id: availability
        run: |
          set -euo pipefail
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          if [[ "$package_name" != "@hraness/direct" ]]; then
            echo "::error::Unexpected package name $package_name"
            exit 1
          fi
          if [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Package version $package_version is not stable semantic version"
            exit 1
          fi
          if ! npm view "$package_name" name --json \
            --registry=https://registry.npmjs.org >/dev/null; then
            echo "::error::$package_name must be bootstrapped before trusted publishing can run"
            exit 1
          fi
          version_error="$RUNNER_TEMP/npm-version-error.txt"
          if npm view "$package_name@$package_version" version --json \
            --registry=https://registry.npmjs.org >/dev/null 2>"$version_error"; then
            already_public=true
          elif grep -q 'E404' "$version_error"; then
            already_public=false
          else
            cat "$version_error"
            echo "::error::Could not determine whether $package_name@$package_version is published"
            exit 1
          fi
          printf 'already_public=%s\n' "$already_public" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Verify generated tree
        run: |
          set -euo pipefail
          generated_status="$(git status --porcelain --untracked-files=all -- dist bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi
      - name: Prepare and smoke exact npm artifact
        id: artifact
        run: |
          set -euo pipefail
          artifact_directory="$RUNNER_TEMP/direct-npm-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          package_version="$(node -p 'require("./package.json").version')"
          tarball_name="hraness-direct-$package_version.tgz"
          archive="$artifact_directory/$tarball_name"
          metadata="$artifact_directory/npm-pack.json"
          digest="$artifact_directory/npm-package.sha256"
          bun run ./scripts/prepare-npm-package.ts "$artifact_directory"
          bun run ./scripts/package-smoke.ts \
            --archive "$archive" \
            --pack-json "$metadata"
          archive_sha256="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          metadata_sha256="$(sha256sum "$metadata" | cut -d ' ' -f 1)"
          printf '%s  %s\n%s  npm-pack.json\n' \
            "$archive_sha256" "$tarball_name" "$metadata_sha256" > "$digest"
          (
            cd "$artifact_directory"
            sha256sum --check npm-package.sha256
          )
          artifact_entry_count="$(ARTIFACT_DIRECTORY="$artifact_directory" node -e '
            const { readdirSync } = require("node:fs");
            process.stdout.write(String(readdirSync(process.env.ARTIFACT_DIRECTORY).length));
          ')"
          if [[ "$artifact_entry_count" != 3 ]]; then
            echo "::error::Reviewed npm artifact must contain exactly three files"
            exit 1
          fi
          for required_file in "$archive" "$metadata" "$digest"; do
            if [[ ! -f "$required_file" || -L "$required_file" ]]; then
              echo "::error::Reviewed npm artifact contains an unsafe or unexpected entry"
              exit 1
            fi
          done
          artifact_name="npm-package-$package_version-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'artifact_name=%s\npackage_version=%s\ntarball_name=%s\n' \
            "$artifact_name" "$package_version" "$tarball_name" >> "$GITHUB_OUTPUT"
      - name: Upload reviewed npm artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          if-no-files-found: error
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ runner.temp }}/direct-npm-${{ github.run_id }}-${{ github.run_attempt }}
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish exact package
    needs: verify
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - name: Pin npm
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0 \
            --ignore-scripts \
            --registry=https://registry.npmjs.org
          test "$(npm --version)" = "11.19.0"
          [[ "$(node --version)" == v24.* ]]
      - name: Bind artifact reference
        env:
          ARTIFACT_NAME: ${{ needs.verify.outputs.artifact_name }}
          EXPECTED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.package_version }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ || \
                ! "$EXPECTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Verified package identity is invalid"
            exit 1
          fi
          expected_artifact_name="npm-package-$EXPECTED_VERSION-$EXPECTED_SOURCE_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ "$ARTIFACT_NAME" != "$expected_artifact_name" ]]; then
            echo "::error::Verified artifact name is not bound to this run and attempt"
            exit 1
          fi
      - name: Download reviewed package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: ${{ runner.temp }}/direct-npm-publish
      - name: Rebind downloaded package
        id: artifact
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          EXPECTED_TARBALL_NAME: ${{ needs.verify.outputs.tarball_name }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.package_version }}
        run: |
          set -euo pipefail
          artifact_directory="$RUNNER_TEMP/direct-npm-publish"
          metadata="$artifact_directory/npm-pack.json"
          digest="$artifact_directory/npm-package.sha256"
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Verified source commit is invalid"
            exit 1
          fi
          if [[ ! "$EXPECTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Verified package version is not stable semantic version"
            exit 1
          fi
          expected_tarball_name="hraness-direct-$EXPECTED_VERSION.tgz"
          if [[ "$EXPECTED_TARBALL_NAME" != "$expected_tarball_name" ]]; then
            echo "::error::Verified tarball name is unsafe or inconsistent"
            exit 1
          fi
          tarball="$artifact_directory/$expected_tarball_name"
          if [[ ! -d "$artifact_directory" || -L "$artifact_directory" ]]; then
            echo "::error::Downloaded npm artifact directory is unsafe"
            exit 1
          fi
          artifact_entry_count="$(ARTIFACT_DIRECTORY="$artifact_directory" node -e '
            const { readdirSync } = require("node:fs");
            process.stdout.write(String(readdirSync(process.env.ARTIFACT_DIRECTORY).length));
          ')"
          if [[ "$artifact_entry_count" != 3 ]]; then
            echo "::error::Downloaded npm artifact must contain exactly the tarball, npm-pack.json, and npm-package.sha256"
            exit 1
          fi
          for required_file in "$tarball" "$metadata" "$digest"; do
            if [[ ! -f "$required_file" || -L "$required_file" ]]; then
              echo "::error::Downloaded npm artifact contains an unsafe or unexpected entry"
              exit 1
            fi
          done
          rebound_output="$(mktemp "$RUNNER_TEMP/direct-rebound-digests.XXXXXX")"
          DIGEST="$digest" \
            EXPECTED_TARBALL_NAME="$expected_tarball_name" \
            EXPECTED_VERSION="$EXPECTED_VERSION" \
            METADATA="$metadata" \
            TARBALL="$tarball" node > "$rebound_output" <<'NODE'
          const { createHash } = require("node:crypto");
          const { readFileSync, statSync } = require("node:fs");

          const minimumFiles = 50;
          const maximumFiles = 60;
          const minimumPackedBytes = 140_000;
          const maximumPackedBytes = 220_000;
          const minimumUnpackedBytes = 650_000;
          const maximumUnpackedBytes = 1_030_000;
          const maximumMetadataBytes = 250_000;
          const expectedName = "@hraness/direct";
          const expectedVersion = process.env.EXPECTED_VERSION;
          const expectedFilename = process.env.EXPECTED_TARBALL_NAME;
          const tarball = process.env.TARBALL;
          const metadata = process.env.METADATA;
          const digest = process.env.DIGEST;
          if (!expectedVersion || !expectedFilename || !tarball || !metadata || !digest) {
            throw new Error("Downloaded artifact environment is incomplete");
          }

          const archiveInfo = statSync(tarball);
          const metadataInfo = statSync(metadata);
          const digestInfo = statSync(digest);
          if (archiveInfo.size < minimumPackedBytes || archiveInfo.size > maximumPackedBytes) {
            throw new Error("Downloaded tarball is outside the reviewed packed-size bound");
          }
          if (metadataInfo.size <= 0 || metadataInfo.size > maximumMetadataBytes) {
            throw new Error("Downloaded npm-pack.json exceeds its reviewed size bound");
          }
          if (digestInfo.size <= 0 || digestInfo.size > 1_024) {
            throw new Error("Downloaded SHA-256 manifest exceeds its reviewed size bound");
          }

          const archiveBytes = readFileSync(tarball);
          const metadataBytes = readFileSync(metadata);
          const digestBytes = readFileSync(digest);
          const archiveSha256 = createHash("sha256").update(archiveBytes).digest("hex");
          const metadataSha256 = createHash("sha256").update(metadataBytes).digest("hex");
          const digestSha256 = createHash("sha256").update(digestBytes).digest("hex");
          const digestText = new TextDecoder("utf-8", { fatal: true }).decode(digestBytes);
          const digestLines = digestText.split("\n");
          if (digestLines.length !== 3 || digestLines[2] !== "") {
            throw new Error("SHA-256 manifest must contain exactly two newline-terminated records");
          }
          const digests = new Map();
          for (const line of digestLines.slice(0, 2)) {
            const match = /^([a-f0-9]{64})  ([A-Za-z0-9._-]+)$/u.exec(line);
            if (!match || digests.has(match[2])) {
              throw new Error("SHA-256 manifest contains an invalid record");
            }
            digests.set(match[2], match[1]);
          }
          if (
            digests.size !== 2 ||
            digests.get(expectedFilename) !== archiveSha256 ||
            digests.get("npm-pack.json") !== metadataSha256
          ) {
            throw new Error("Downloaded files differ from the independent SHA-256 manifest");
          }

          const input = JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(metadataBytes));
          if (!Array.isArray(input) || input.length !== 1) {
            throw new Error("npm-pack.json must contain exactly one package");
          }
          const record = input[0];
          if (!record || typeof record !== "object" || Array.isArray(record)) {
            throw new Error("npm-pack.json package record is invalid");
          }
          if (record.name !== expectedName || record.id !== `${expectedName}@${expectedVersion}`) {
            throw new Error("npm-pack.json has the wrong package identity");
          }
          if (record.version !== expectedVersion || record.filename !== expectedFilename) {
            throw new Error("npm-pack.json has the wrong version or tarball filename");
          }
          if (!/^hraness-direct-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.tgz$/u.test(record.filename)) {
            throw new Error("npm-pack.json has an unsafe tarball filename");
          }
          for (const [field, minimum, maximum] of [
            ["entryCount", minimumFiles, maximumFiles],
            ["size", minimumPackedBytes, maximumPackedBytes],
            ["unpackedSize", minimumUnpackedBytes, maximumUnpackedBytes],
          ]) {
            if (!Number.isSafeInteger(record[field]) || record[field] < minimum || record[field] > maximum) {
              throw new Error(`npm-pack.json has an invalid or excessive ${field}`);
            }
          }
          if (record.size !== archiveBytes.byteLength) {
            throw new Error("Downloaded tarball byte size differs from npm-pack.json");
          }
          if (!Array.isArray(record.files) || record.files.length !== record.entryCount) {
            throw new Error("npm-pack.json has an invalid file inventory count");
          }
          const paths = new Set();
          let unpackedSize = 0;
          for (const file of record.files) {
            if (!file || typeof file !== "object" || Array.isArray(file)) {
              throw new Error("npm-pack.json file inventory contains a non-object");
            }
            if (
              typeof file.path !== "string" ||
              file.path.length === 0 ||
              Buffer.byteLength(file.path, "utf8") > 1_024 ||
              file.path.includes("\\") ||
              file.path.includes("\0") ||
              file.path.startsWith("/") ||
              file.path.split("/").some((part) => part === "" || part === "." || part === "..") ||
              paths.has(file.path)
            ) {
              throw new Error("npm-pack.json file inventory contains an unsafe or duplicate path");
            }
            if (!Number.isSafeInteger(file.size) || file.size < 0) {
              throw new Error("npm-pack.json file inventory contains an invalid size");
            }
            if (file.mode !== 0o644 && file.mode !== 0o755) {
              throw new Error("npm-pack.json file inventory contains an invalid mode");
            }
            paths.add(file.path);
            unpackedSize += file.size;
            if (!Number.isSafeInteger(unpackedSize) || unpackedSize > maximumUnpackedBytes) {
              throw new Error("npm-pack.json file inventory exceeds the reviewed unpacked-size bound");
            }
          }
          if (unpackedSize !== record.unpackedSize) {
            throw new Error("npm-pack.json unpacked size differs from its file inventory");
          }
          for (const requiredPath of [
            "LICENSE",
            "README.md",
            "dist/core/index.js",
            "dist/index.js",
            "dist/react.js",
            "dist/testing/index.js",
            "dist/tooling/bombadil.js",
            "dist/tooling/browser-verification-entry.js",
            "dist/tooling/bundle-boundary.js",
            "dist/web.js",
            "package.json",
            "skills/direct/SKILL.md",
          ]) {
            if (!paths.has(requiredPath)) {
              throw new Error(`npm-pack.json is missing required package path ${requiredPath}`);
            }
          }
          const integrity = `sha512-${createHash("sha512").update(archiveBytes).digest("base64")}`;
          const shasum = createHash("sha1").update(archiveBytes).digest("hex");
          if (record.integrity !== integrity || record.shasum !== shasum) {
            throw new Error("Downloaded tarball differs from npm-pack.json SHA-1 or SHA-512");
          }
          process.stdout.write(`${archiveSha256} ${metadataSha256} ${digestSha256}\n`);
          NODE
          read -r rebound_archive_sha256 rebound_metadata_sha256 rebound_digest_sha256 < "$rebound_output"
          for rebound_digest in \
            "$rebound_archive_sha256" \
            "$rebound_metadata_sha256" \
            "$rebound_digest_sha256"; do
            if [[ ! "$rebound_digest" =~ ^[a-f0-9]{64}$ ]]; then
              echo "::error::Could not preserve rebound package digests"
              exit 1
            fi
          done
          printf 'archive_sha256=%s\nmetadata_sha256=%s\ndigest_sha256=%s\n' \
            "$rebound_archive_sha256" "$rebound_metadata_sha256" "$rebound_digest_sha256" \
            >> "$GITHUB_OUTPUT"
          printf 'tarball=%s\nmetadata=%s\ndigest=%s\n' \
            "$tarball" "$metadata" "$digest" >> "$GITHUB_OUTPUT"
      - name: Revalidate release tag and publish exact package
        env:
          ALREADY_PUBLIC: ${{ needs.verify.outputs.already_public }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DIGEST: ${{ steps.artifact.outputs.digest }}
          EXPECTED_ARCHIVE_SHA256: ${{ steps.artifact.outputs.archive_sha256 }}
          EXPECTED_DIGEST_SHA256: ${{ steps.artifact.outputs.digest_sha256 }}
          EXPECTED_METADATA_SHA256: ${{ steps.artifact.outputs.metadata_sha256 }}
          EXPECTED_SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.package_version }}
          METADATA: ${{ steps.artifact.outputs.metadata }}
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/$DEFAULT_BRANCH"
          if [[ ! "$EXPECTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Verified package version is not stable semantic version"
            exit 1
          fi
          release_tag="v$EXPECTED_VERSION"
          git check-ref-format "refs/tags/$release_tag"
          current_repository="$RUNNER_TEMP/direct-current-repository.git"
          git init --quiet --bare "$current_repository"
          git --git-dir="$current_repository" fetch --quiet --no-tags \
            "https://github.com/$GITHUB_REPOSITORY.git" \
            "refs/heads/$DEFAULT_BRANCH:refs/heads/$DEFAULT_BRANCH" \
            "refs/tags/v*:refs/tags/v*"
          current_default_sha="$(git --git-dir="$current_repository" rev-parse "refs/heads/$DEFAULT_BRANCH")"
          current_tag_sha="$(git --git-dir="$current_repository" rev-parse "refs/tags/$release_tag^{commit}")"
          if [[ "$GITHUB_REF" != "refs/tags/$release_tag" || \
                "$GITHUB_SHA" != "$EXPECTED_SOURCE_SHA" || \
                "$current_tag_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "::error::Tag $release_tag changed after artifact verification"
            exit 1
          fi
          if ! git --git-dir="$current_repository" merge-base --is-ancestor \
            "$EXPECTED_SOURCE_SHA" "$current_default_sha"; then
            echo "::error::Tag $release_tag is no longer reachable from $DEFAULT_BRANCH"
            exit 1
          fi
          current_archive_sha256="$(sha256sum "$TARBALL" | cut -d ' ' -f 1)"
          current_metadata_sha256="$(sha256sum "$METADATA" | cut -d ' ' -f 1)"
          current_digest_sha256="$(sha256sum "$DIGEST" | cut -d ' ' -f 1)"
          if [[ "$current_archive_sha256" != "$EXPECTED_ARCHIVE_SHA256" || \
                "$current_metadata_sha256" != "$EXPECTED_METADATA_SHA256" || \
                "$current_digest_sha256" != "$EXPECTED_DIGEST_SHA256" ]]; then
            echo "::error::Downloaded package changed after release-tag verification"
            exit 1
          fi
          case "$ALREADY_PUBLIC" in
            true)
              echo "@hraness/direct@$EXPECTED_VERSION is already public; registry verification will prove identity"
              ;;
            false)
              published_versions_json="$(npm view @hraness/direct versions --json \
                --registry=https://registry.npmjs.org)"
              EXPECTED_VERSION="$EXPECTED_VERSION" \
                PUBLISHED_VERSIONS_JSON="$published_versions_json" node <<'NODE'
          const pattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u;
          const parse = (version) => {
            const match = pattern.exec(version);
            return match === null ? null : match.slice(1).map(BigInt);
          };
          const compare = (left, right) => {
            for (let index = 0; index < 3; index += 1) {
              if (left[index] !== right[index]) return left[index] > right[index] ? 1 : -1;
            }
            return 0;
          };
          const expectedVersion = process.env.EXPECTED_VERSION ?? "";
          const expected = parse(expectedVersion);
          const input = JSON.parse(process.env.PUBLISHED_VERSIONS_JSON ?? "null");
          const publishedVersions = Array.isArray(input) ? input : [input];
          if (expected === null || publishedVersions.length === 0) {
            throw new Error("Published-version ordering proof is incomplete");
          }
          for (const publishedVersion of publishedVersions) {
            if (typeof publishedVersion !== "string") {
              throw new Error("Published-version ordering proof is invalid");
            }
            const published = parse(publishedVersion);
            if (published === null) continue;
            if (compare(expected, published) <= 0) {
              throw new Error(
                `@hraness/direct@${expectedVersion} is not newer than published stable ${publishedVersion}`,
              );
            }
          }
          NODE
              newest_stable_tag="$(git --git-dir="$current_repository" tag --list 'v*' \
                | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
                | LC_ALL=C sort -V \
                | tail -n 1)"
              if [[ "$newest_stable_tag" != "$release_tag" ]]; then
                echo "::error::Tag $release_tag is not the newest stable tag $newest_stable_tag"
                exit 1
              fi
              npm publish "$TARBALL" \
                --access public \
                --ignore-scripts \
                --provenance \
                --registry=https://registry.npmjs.org
              ;;
            *)
              echo "::error::Verified package publication state is invalid"
              exit 1
              ;;
          esac
