name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing canonical tag to mirror, or pre-canonical tag to repair
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize release request
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.route.outputs.mode }}
      tag: ${{ steps.route.outputs.tag }}
    steps:
      - name: Verify immutable owner and route the exact request
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          REF_PROTECTED: ${{ github.ref_protected }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync, appendFileSync } from 'node:fs';
          const e = process.env;
          const event = JSON.parse(readFileSync(e.GITHUB_EVENT_PATH, 'utf8'));
          if (e.GITHUB_ACTOR_ID !== '894119' || e.GITHUB_REPOSITORY !== 'hraness/direct' || e.GITHUB_REPOSITORY_ID !== '1306913032'
            || e.REF_PROTECTED !== 'true' || event.sender?.id !== 894119 || event.sender?.type !== 'User'
            || event.repository?.id !== 1306913032 || event.repository?.full_name !== 'hraness/direct'
            || event.repository?.private !== false || event.repository?.default_branch !== 'main') throw new Error('Unexpected release authority');
          const api = path => JSON.parse(execFileSync('gh', ['api', `repos/hraness/direct/${path}`],
            { encoding: 'utf8', timeout: 30000, killSignal: 'SIGKILL', maxBuffer: 1000000, stdio: ['ignore', 'pipe', 'pipe'] }));
          const run = api(`actions/runs/${e.GITHUB_RUN_ID}/attempts/${e.GITHUB_RUN_ATTEMPT}`);
          if (run.id !== Number(e.GITHUB_RUN_ID) || run.run_attempt !== Number(e.GITHUB_RUN_ATTEMPT)
            || run.workflow_id !== 320004413 || run.path !== '.github/workflows/release.yml' || run.head_sha !== e.GITHUB_SHA
            || run.actor?.id !== 894119 || run.actor?.type !== 'User' || run.triggering_actor?.id !== 894119 || run.triggering_actor?.type !== 'User'
            || run.repository?.id !== 1306913032 || run.status !== 'in_progress' || run.conclusion !== null) throw new Error('Untrusted release run');
          const pushed = e.GITHUB_EVENT_NAME === 'push';
          const tag = pushed ? e.GITHUB_REF_NAME : e.REQUESTED_TAG;
          if (!/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/u.test(tag ?? '') || tag.length > 51) throw new Error('Expected one stable tag');
          if (pushed ? e.GITHUB_REF !== `refs/tags/${tag}` : e.GITHUB_EVENT_NAME !== 'workflow_dispatch' || e.GITHUB_REF !== 'refs/heads/main'
            || api('git/ref/heads/main').object?.sha !== e.GITHUB_SHA) throw new Error('Request is not the protected tag or current main');
          const v = tag.slice(1).split('.').map(BigInt), last = [0n, 7n, 20n];
          let order = 0;
          for (let i = 0; i < 3; i++) if (v[i] !== last[i]) { order = v[i] > last[i] ? 1 : -1; break; }
          if (pushed && order <= 0) throw new Error('Historical versions cannot request canonical publication');
          const mode = pushed ? 'canonical' : order > 0 ? 'mirror' : 'legacy';
          appendFileSync(e.GITHUB_OUTPUT, `mode=${mode}\ntag=${tag}\n`);
          NODE

  verify:
    name: Verify
    needs: authorize
    if: needs.authorize.outputs.mode == 'canonical'
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      archive_sha256: ${{ steps.pack.outputs.archive_sha256 }}
      pack_sha256: ${{ steps.pack.outputs.pack_sha256 }}
      manifest_sha256: ${{ steps.pack.outputs.manifest_sha256 }}
      sums_sha256: ${{ steps.pack.outputs.sums_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      archive_name: ${{ steps.pack.outputs.archive_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - name: Fetch only governed release history
        run: |
          set -euo pipefail
          git fetch --no-tags --unshallow origin "refs/heads/main:refs/remotes/origin/main"
          git fetch --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/direct-release-tags/$GITHUB_REF_NAME"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.1"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Authorize exact source and current helper closure
        id: authority
        run: node scripts/github-release.ts authorize "$RUNNER_TEMP"
      - name: Verify release identity
        run: |
          set -euo pipefail
          package_version="$(node -p 'require("./package.json").version')"
          [[ "$GITHUB_REF_NAME" == "v$package_version" ]]
          [[ "$(git cat-file -t "refs/direct-release-tags/$GITHUB_REF_NAME")" == commit ]]
          [[ "$(git rev-parse "refs/direct-release-tags/$GITHUB_REF_NAME^{commit}")" == "$GITHUB_SHA" ]]
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - run: npm install --global --ignore-scripts npm@11.19.0 --registry=https://registry.npmjs.org
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Verify clean source tree
        run: |
          set -euo pipefail
          source_status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$source_status" ]]; then
            printf '%s\n' "$source_status"
            exit 1
          fi
      - name: Pack and verify canonical artifact
        id: pack
        env:
          CURRENT_AUTHORITY_SHA: ${{ steps.authority.outputs.authority_sha }}
        run: |
          set -euo pipefail
          release_directory="$RUNNER_TEMP/direct-release"
          bun --no-env-file --config=/dev/null run ./scripts/prepare-npm-package.ts "$release_directory"
          package_version="$(node -p 'require("./package.json").version')"
          archive_name="hraness-direct-$package_version.tgz"
          bun run scripts/prepare-github-release.ts "$release_directory"
          bun run scripts/package-smoke.ts --archive "$release_directory/$archive_name" --pack-json "$release_directory/npm-pack.json"
          printf 'archive_name=%s\n' "$archive_name" >> "$GITHUB_OUTPUT"
      - name: Upload verified canonical artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: direct-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/direct-release
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest canonical artifact
    needs: verify
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_ARCHIVE_SHA256: ${{ needs.verify.outputs.archive_sha256 }}
      EXPECTED_PACK_SHA256: ${{ needs.verify.outputs.pack_sha256 }}
      EXPECTED_MANIFEST_SHA256: ${{ needs.verify.outputs.manifest_sha256 }}
      EXPECTED_SUMS_SHA256: ${{ needs.verify.outputs.sums_sha256 }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.1"
          package-manager-cache: false
      - name: Load current release authority
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const e = process.env;
          if (e.GITHUB_REPOSITORY !== 'hraness/direct' || e.GITHUB_REPOSITORY_ID !== '1306913032'
            || e.GITHUB_ACTOR_ID !== '894119' || e.GITHUB_EVENT_NAME !== 'push'
            || !/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/u.test(e.GITHUB_REF_NAME ?? '')
            || e.GITHUB_REF !== `refs/tags/${e.GITHUB_REF_NAME}` || !/^[a-f0-9]{40}$/u.test(e.GITHUB_SHA ?? '')) throw new Error('Unexpected release request');
          const api = path => JSON.parse(execFileSync('gh', ['api', `repos/hraness/direct/${path}`],
            { encoding: 'utf8', timeout: 30000, killSignal: 'SIGKILL', maxBuffer: 1000000, stdio: ['ignore', 'pipe', 'pipe'] }));
          const run = api(`actions/runs/${e.GITHUB_RUN_ID}/attempts/${e.GITHUB_RUN_ATTEMPT}`);
          if (run.id !== Number(e.GITHUB_RUN_ID) || run.run_attempt !== Number(e.GITHUB_RUN_ATTEMPT)
            || run.head_sha !== e.GITHUB_SHA || run.head_branch !== e.GITHUB_REF_NAME || run.event !== 'push'
            || run.workflow_id !== 320004413 || run.path !== '.github/workflows/release.yml'
            || run.actor?.id !== 894119 || run.actor?.type !== 'User' || run.triggering_actor?.id !== 894119 || run.triggering_actor?.type !== 'User'
            || run.repository?.id !== 1306913032 || run.repository?.full_name !== 'hraness/direct' || run.repository?.private !== false
            || run.status !== 'in_progress' || run.conclusion !== null) throw new Error('Untrusted release attempt');
          const main = api('git/ref/heads/main').object;
          if (main?.type !== 'commit' || !/^[a-f0-9]{40}$/u.test(main.sha ?? '')) throw new Error('Invalid current main');
          for (const path of ['.github/workflows/release.yml', 'scripts/github-release.ts', 'scripts/prepare-github-release.ts', 'scripts/package-smoke.ts', 'scripts/npm-package-identity.ts', 'scripts/prepare-npm-package.ts', 'scripts/package-artifact.ts', '.github/workflows/npm-publish.yml', 'package.json', 'bun.lock']) {
            const decode = ref => {
              const file = api(`contents/${path}?ref=${ref}`);
              if (file.type !== 'file' || file.encoding !== 'base64' || typeof file.content !== 'string' || file.content.length > 300000) throw new Error('Unsafe authority file');
              return Buffer.from(file.content, 'base64');
            };
            const current = decode(main.sha);
            if (!current.equals(decode(e.GITHUB_SHA))) throw new Error(`Current authority changed: ${path}`);
            if (path === 'scripts/github-release.ts') writeFileSync(`${e.RUNNER_TEMP}/github-release.ts`, current, { flag: 'wx', mode: 0o600 });
          }
          NODE
          node "$RUNNER_TEMP/github-release.ts" authorize "$RUNNER_TEMP"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/direct-release
      - name: Rebind verified artifact before OIDC
        run: node "$RUNNER_TEMP/github-release.ts" verify "$RUNNER_TEMP/direct-release"
      - name: Attest exact canonical files
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/direct-release/${{ needs.verify.outputs.archive_name }}
            ${{ runner.temp }}/direct-release/npm-pack.json
            ${{ runner.temp }}/direct-release/release-manifest.json
            ${{ runner.temp }}/direct-release/SHA256SUMS
          push-to-registry: false
          create-storage-record: false
      - name: Preserve signed bundle and verify it
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
          EXPECT_SIGNED: "true"
        run: |
          set -euo pipefail
          test -f "$BUNDLE_PATH" && test ! -L "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" "$RUNNER_TEMP/direct-release/provenance.jsonl"
          node "$RUNNER_TEMP/github-release.ts" verify "$RUNNER_TEMP/direct-release"
      - name: Upload attested canonical artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: direct-attested-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/direct-release
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish
    needs: [verify, attest]
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_ARCHIVE_SHA256: ${{ needs.verify.outputs.archive_sha256 }}
      EXPECTED_PACK_SHA256: ${{ needs.verify.outputs.pack_sha256 }}
      EXPECTED_MANIFEST_SHA256: ${{ needs.verify.outputs.manifest_sha256 }}
      EXPECTED_SUMS_SHA256: ${{ needs.verify.outputs.sums_sha256 }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.1"
          package-manager-cache: false
      - name: Load current release authority
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const e = process.env;
          if (e.GITHUB_REPOSITORY !== 'hraness/direct' || e.GITHUB_REPOSITORY_ID !== '1306913032'
            || e.GITHUB_ACTOR_ID !== '894119' || e.GITHUB_EVENT_NAME !== 'push'
            || !/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/u.test(e.GITHUB_REF_NAME ?? '')
            || e.GITHUB_REF !== `refs/tags/${e.GITHUB_REF_NAME}` || !/^[a-f0-9]{40}$/u.test(e.GITHUB_SHA ?? '')) throw new Error('Unexpected release request');
          const api = path => JSON.parse(execFileSync('gh', ['api', `repos/hraness/direct/${path}`],
            { encoding: 'utf8', timeout: 30000, killSignal: 'SIGKILL', maxBuffer: 1000000, stdio: ['ignore', 'pipe', 'pipe'] }));
          const run = api(`actions/runs/${e.GITHUB_RUN_ID}/attempts/${e.GITHUB_RUN_ATTEMPT}`);
          if (run.id !== Number(e.GITHUB_RUN_ID) || run.run_attempt !== Number(e.GITHUB_RUN_ATTEMPT)
            || run.head_sha !== e.GITHUB_SHA || run.head_branch !== e.GITHUB_REF_NAME || run.event !== 'push'
            || run.workflow_id !== 320004413 || run.path !== '.github/workflows/release.yml'
            || run.actor?.id !== 894119 || run.actor?.type !== 'User' || run.triggering_actor?.id !== 894119 || run.triggering_actor?.type !== 'User'
            || run.repository?.id !== 1306913032 || run.repository?.full_name !== 'hraness/direct' || run.repository?.private !== false
            || run.status !== 'in_progress' || run.conclusion !== null) throw new Error('Untrusted release attempt');
          const main = api('git/ref/heads/main').object;
          if (main?.type !== 'commit' || !/^[a-f0-9]{40}$/u.test(main.sha ?? '')) throw new Error('Invalid current main');
          for (const path of ['.github/workflows/release.yml', 'scripts/github-release.ts', 'scripts/prepare-github-release.ts', 'scripts/package-smoke.ts', 'scripts/npm-package-identity.ts', 'scripts/prepare-npm-package.ts', 'scripts/package-artifact.ts', '.github/workflows/npm-publish.yml', 'package.json', 'bun.lock']) {
            const decode = ref => {
              const file = api(`contents/${path}?ref=${ref}`);
              if (file.type !== 'file' || file.encoding !== 'base64' || typeof file.content !== 'string' || file.content.length > 300000) throw new Error('Unsafe authority file');
              return Buffer.from(file.content, 'base64');
            };
            const current = decode(main.sha);
            if (!current.equals(decode(e.GITHUB_SHA))) throw new Error(`Current authority changed: ${path}`);
            if (path === 'scripts/github-release.ts') writeFileSync(`${e.RUNNER_TEMP}/github-release.ts`, current, { flag: 'wx', mode: 0o600 });
          }
          NODE
          node "$RUNNER_TEMP/github-release.ts" authorize "$RUNNER_TEMP"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          artifact-ids: ${{ needs.attest.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/direct-release
      - name: Publish verified immutable GitHub Release
        run: node "$RUNNER_TEMP/github-release.ts" publish "$RUNNER_TEMP/direct-release"

  npm:
    name: Mirror canonical package to npm
    needs: [authorize, publish]
    if: >-
      ${{ always() && needs.authorize.result == 'success'
          && ((needs.authorize.outputs.mode == 'canonical' && needs.publish.result == 'success')
              || needs.authorize.outputs.mode == 'mirror') }}
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/npm-publish.yml
    with:
      tag: ${{ needs.authorize.outputs.tag }}

  legacy:
    name: Recover historical GitHub Release
    needs: authorize
    if: needs.authorize.outputs.mode == 'legacy'
    permissions:
      contents: write
    uses: ./.github/workflows/legacy-release.yml
    with:
      tag: ${{ needs.authorize.outputs.tag }}
