name: Stage npm package

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-stage
  cancel-in-progress: false

jobs:
  stage:
    name: Check and stage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Pin npm
        run: npm install --global npm@11.19.0 --ignore-scripts
      - name: Require current default-branch head
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          expected_ref="refs/heads/$DEFAULT_BRANCH"
          if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
            echo "::error::Dispatch this workflow from $expected_ref, received $GITHUB_REF"
            exit 1
          fi
          git fetch --no-tags origin \
            "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          default_head="$(git rev-parse "origin/$DEFAULT_BRANCH")"
          checked_out_head="$(git rev-parse HEAD)"
          if [[ "$GITHUB_SHA" != "$default_head" || "$checked_out_head" != "$default_head" ]]; then
            echo "::error::Dispatch commit $GITHUB_SHA is not current $DEFAULT_BRANCH head $default_head"
            exit 1
          fi
      - name: Verify package can be staged
        run: |
          set -euo pipefail
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"
          if ! npm view "$package_name" name --json \
            --registry=https://registry.npmjs.org >/dev/null; then
            echo "::error::$package_name must be bootstrapped interactively before staged publishing can run"
            exit 1
          fi
          if npm view "$package_name@$package_version" version --json \
            --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "::error::$package_name@$package_version is already public"
            exit 1
          fi
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Verify generated tree
        run: |
          set -euo pipefail
          generated_status="$(git status --porcelain --untracked-files=all -- dist bun.lock)"
          if [[ -n "$generated_status" ]]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi
      - name: Prepare exact npm artifact
        id: artifact
        run: |
          set -euo pipefail
          artifact_directory="$RUNNER_TEMP/direct-npm-artifact"
          package_version="$(node -p 'require("./package.json").version')"
          archive="$artifact_directory/hraness-direct-$package_version.tgz"
          bun run ./scripts/prepare-npm-package.ts "$artifact_directory"
          bun run ./scripts/package-smoke.ts "$archive"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'name=hraness-direct-%s\n' "$package_version" >> "$GITHUB_OUTPUT"
      - name: Upload reviewed npm artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          if-no-files-found: error
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.archive }}
          retention-days: 30
      - name: Stage exact npm artifact
        env:
          ARCHIVE: ${{ steps.artifact.outputs.archive }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          default_head="$(git rev-parse "origin/$DEFAULT_BRANCH")"
          if [[ "$GITHUB_SHA" != "$default_head" ]]; then
            echo "::error::$DEFAULT_BRANCH advanced to $default_head after artifact verification"
            exit 1
          fi
          npm stage publish "$ARCHIVE" \
            --access public \
            --ignore-scripts \
            --registry=https://registry.npmjs.org
